<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TastyByte</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .checkout-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .checkout-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2d3047;
        }

        .checkout-form input,
        .checkout-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .checkout-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkout-form button {
            width: 100%;
            background: #ff6b35;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .checkout-form button:hover {
            background: #e85a28;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h2>Checkout</h2>

        <form method="POST" class="checkout-form">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Enter your name" required>
            <input type="text" name="phone" placeholder="Enter phone number" required>
            <textarea name="address" placeholder="Enter your address" required></textarea>
           <input type="number" name="total_amount" id="totalAmount" readonly>
            <button type="submit">Place Order</button>
        </form>
    </div>
   <script>
    const savedTotal = localStorage.getItem("cartTotal") || 0;
    document.getElementById("totalAmount").value = savedTotal;
</script>
</body>
</html>
