<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - TastyByte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .success-container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .success-container h1 {
            color: green;
            margin-bottom: 20px;
        }

        .success-container p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .success-container a {
            display: inline-block;
            padding: 12px 25px;
            background: #ff6b35;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h1>Order Placed Successfully 🎉</h1>
        <p>Thank you for ordering from TastyByte.</p>
        <a href="{% url 'home' %}">Go Back Home</a>
    </div>
</body>
</html>
